  function el(tag, attrs, text) { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; svg.appendChild(e); return e; }
  for (let s = 1; s <= 12; s++) {
    el('text', { x: x0 + (s - 1) * w + w / 2, y: 30, 'text-anchor': 'middle', class: 'xs' }, 'S' + s);
    el('line', { x1: x0 + (s - 1) * w, y1: 40, x2: x0 + (s - 1) * w, y2: y0 + lots.length * h + 5, stroke: '#e2e8f0' });
  }
  lots.forEach(([label, a, b, cls], i) => {
    const y = y0 + i * h;
    el('text', { x: 20, y: y + 20, class: 's' }, label);
    el('rect', { x: x0 + (a - 1) * w + 3, y: y + 5, width: (b - a + 1) * w - 6, height: h - 10, rx: 5, class: cls });
  });
  const ms = [[7, 'S7 : workflow complet démontrable'], [10, 'S10 : paiements simulés réalistes'], [12, 'S12 : version pilote en ligne']];
  ms.forEach(([s, t], k) => {
    const x = x0 + s * w - 2, y = y0 + lots.length * h + 18;
    el('path', { d: `M${x} ${y - 8} l7 7 l-7 7 l-7 -7 z`, fill: '#1e40af' });
    const lx = 20 + k * 360, ly = y0 + lots.length * h + 60;
    el('path', { d: `M${lx + 7} ${ly - 12} l7 7 l-7 7 l-7 -7 z`, fill: '#1e40af' });
    el('text', { x: lx + 22, y: ly, class: 's' }, t);
  });
</script>
