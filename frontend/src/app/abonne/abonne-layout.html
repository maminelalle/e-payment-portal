<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/abonne">
      <span class="brand-logo">EP</span>
      <span class="brand-name">E-Payment</span>
    </a>
    <nav>
      @for (item of menu; track item.lien) {
        <a
          class="nav-item"
          [routerLink]="item.lien"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          >{{ item.libelle }}</a
        >
      }
    </nav>
    <button type="button" class="menu-button icon-button" aria-label="Ouvrir le menu"
            (click)="menuOpen.set(true)">
      <i class="pi pi-bars"></i>
    </button>
    <app-header-tools class="topbar-actions" space="abonne" profileLink="/abonne/profil"
                      [notifications]="notifications()" />
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<p-drawer [(visible)]="menuOpen" [position]="preferences.isArabic() ? 'left' : 'right'" header="Navigation">
  <nav class="mobile-nav">
    @for (item of menu; track item.lien) {
      <a class="nav-item" [routerLink]="item.lien" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.exact }" (click)="menuOpen.set(false)">
        {{ item.libelle }}
      </a>
    }
  </nav>
  <!-- Sur téléphone, le choix de langue de l'en-tête est masqué : il est proposé ici. -->
  <div class="mobile-lang">
    <span class="muted">Langue</span>
    <div class="ep-lang" role="group" aria-label="Langue">
      <button type="button" [attr.aria-pressed]="preferences.language() === 'fr'" lang="fr"
              (click)="preferences.setLanguage('fr')">FR</button>
      <button type="button" [attr.aria-pressed]="preferences.language() === 'ar'" lang="ar"
              (click)="preferences.setLanguage('ar')">عربي</button>
    </div>
  </div>
</p-drawer>

<p-toast position="top-right" />
