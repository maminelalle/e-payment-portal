<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/abonne">
      <span class="brand-logo">EP</span>
      <span class="brand-name">E-Payment</span>
    </a>
    <nav>
      @for (item of menu; track item.lien) {
        <a
          class="nav-item"
          [routerLink]="item.lien"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          >{{ item.libelle }}</a
        >
      }
    </nav>
    <button type="button" class="menu-button icon-button" aria-label="Ouvrir le menu"
            (click)="menuOpen.set(true)">
      <i class="pi pi-bars"></i>
    </button>
    <app-header-tools class="topbar-actions" space="abonne" profileLink="/abonne/profil"
                      [notifications]="notifications()" />
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<p-drawer [(visible)]="menuOpen" [position]="preferences.isArabic() ? 'left' : 'right'" header="Navigation">
  <nav class="mobile-nav">
    @for (item of menu; track item.lien) {
      <a class="nav-item" [routerLink]="item.lien" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.exact }" (click)="menuOpen.set(false)">
        {{ item.libelle }}
      </a>
    }
  </nav>
</p-drawer>

<p-toast position="top-right" />
