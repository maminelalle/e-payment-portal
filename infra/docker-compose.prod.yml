# Production (ou recette) : tout le portail en conteneurs, un seul point d'entrée HTTPS.
#   cp infra/.env.prod.example infra/.env.prod   puis compléter les valeurs
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
# Seuls les ports HTTP/HTTPS de Nginx sont publiés ; base, Keycloak, S3 et backend restent sur le réseau interne.
name: epayment-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16.15
    environment:
      POSTGRES_DB: epayment
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d epayment"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8.1
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Derrière Nginx (TLS terminé par Nginx), servi sous https://<domaine>/auth
      KC_HOSTNAME: ${PORTAL_URL}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Valeurs reprises dans prod/epayment-realm.json à l'import
      PORTAL_URL: ${PORTAL_URL}
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET}
      KEYCLOAK_FIRST_ADMIN_EMAIL: ${KEYCLOAK_FIRST_ADMIN_EMAIL}
      KEYCLOAK_FIRST_ADMIN_PASSWORD: ${KEYCLOAK_FIRST_ADMIN_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_AUTH: ${MAIL_AUTH}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
    volumes:
      - ./keycloak/prod/epayment-realm.json:/opt/keycloak/data/import/epayment-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  s3:
    <<: *restart
    image: chrislusf/seaweedfs:4.51
    # Identifiants S3 écrits au démarrage depuis l'environnement (aucune clé dans le dépôt).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"epayment","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3-data:/data

  simulator:
    <<: *restart
    build: ../simulator
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /simulateur
      SIMULATOR_PUBLIC_URL: ${PORTAL_URL}/simulateur
      PORTAL_WEBHOOK_BASE: http://backend:8080/api/webhooks
      BANKILY_API_KEY: ${BANKILY_API_KEY}
      BANKILY_WEBHOOK_SECRET: ${BANKILY_WEBHOOK_SECRET}
      MASRVI_API_KEY: ${MASRVI_API_KEY}
      MASRVI_WEBHOOK_SECRET: ${MASRVI_WEBHOOK_SECRET}
      VISA_API_KEY: ${VISA_API_KEY}
      VISA_WEBHOOK_SECRET: ${VISA_WEBHOOK_SECRET}

  backend:
    <<: *restart
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/epayment
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTAL_URL: ${PORTAL_URL}
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER_URI: ${PORTAL_URL}/auth/realms/epayment
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: Portail E-Payment <${MAIL_FROM_ADDRESS}>
      MAIL_AUTH: ${MAIL_AUTH}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SIGNATURE_OTP_SECRET: ${SIGNATURE_OTP_SECRET}
      SIGNATURE_SEAL_KEYSTORE: ${SIGNATURE_SEAL_KEYSTORE:-}
      SIGNATURE_SEAL_KEYSTORE_PASSWORD: ${SIGNATURE_SEAL_KEYSTORE_PASSWORD:-}
      RECEIPT_VERIFICATION_SECRET: ${RECEIPT_VERIFICATION_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      BANKILY_BASE_URL: http://simulator:8090/simulateur/bankily/api/v1
      BANKILY_API_KEY: ${BANKILY_API_KEY}
      BANKILY_WEBHOOK_SECRET: ${BANKILY_WEBHOOK_SECRET}
      MASRVI_BASE_URL: http://simulator:8090/simulateur/masrvi/v2
      MASRVI_API_KEY: ${MASRVI_API_KEY}
      MASRVI_WEBHOOK_SECRET: ${MASRVI_WEBHOOK_SECRET}
      VISA_BASE_URL: http://simulator:8090/simulateur/visa-gateway/api/v1
      VISA_API_KEY: ${VISA_API_KEY}
      VISA_WEBHOOK_SECRET: ${VISA_WEBHOOK_SECRET}
    volumes:
      - ./secrets:/run/secrets/epayment:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  nginx:
    <<: *restart
    build: ../frontend
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

  # Sauvegarde quotidienne : dump PostgreSQL + copie des documents S3, conservés 30 jours (voir backup/).
  backup:
    <<: *restart
    build: ./backup
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: epayment
      EXTRA_DB_NAMES: keycloak
      DB_USER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_ACCESS_KEY: ${OFFSITE_ACCESS_KEY:-}
      OFFSITE_SECRET_KEY: ${OFFSITE_SECRET_KEY:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  s3-data:
