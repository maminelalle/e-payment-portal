# Environnement de développement local.
# Le backend (port 8080) et le frontend (port 4200) tournent sur le poste ;
# Nginx les expose ensemble sur http://localhost.
name: epayment

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: epayment
      POSTGRES_USER: ${DB_USER:-epayment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epayment}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d epayment"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/epayment-realm.json:/opt/keycloak/data/import/epayment-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Stockage objet compatible S3 (contrats PDF, versions signées, reçus).
  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Boîte mail de test : SMTP sur 1025, interface web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"
      - "8025:8025"

  nginx:
    image: nginx:1.31.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  s3-data:
