spring:
  application:
    name: epayment-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/epayment}
    username: ${DB_USER:epayment}
    password: ${DB_PASSWORD:epayment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Les modèles de contrat contiennent des expressions Thymeleaf ${...} : pas de substitution Flyway.
    placeholder-replacement: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/epayment}
      # Compte de service du backend pour l'API d'administration Keycloak (création des comptes abonnés)
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: epayment-backend
            client-secret: ${KEYCLOAK_BACKEND_SECRET:epayment-backend-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/epayment/protocol/openid-connect/token
  mvc:
    problemdetails:
      enabled: true
  # Emails du portail ; en développement ils arrivent dans Mailpit (http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  jackson:
    time-zone: Africa/Nouakchott

server:
  port: 8080
  shutdown: graceful
  # IP réelle du client transmise par Nginx (X-Forwarded-For, proxys internes uniquement)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Un serveur mail indisponible ne doit pas déclarer le portail hors service (les emails sont secondaires).
    mail:
      enabled: false

epayment:
  time-zone: Africa/Nouakchott
  default-currency: MRU
  portal-url: ${PORTAL_URL:http://localhost}
  mail-from: ${MAIL_FROM:Portail E-Payment <no-reply@epayment.mr>}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:epayment-documents}
    access-key: ${S3_ACCESS_KEY:epayment-dev}
    secret-key: ${S3_SECRET_KEY:epayment-dev-secret}
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: epayment
    # Le lien d'invitation (définir son mot de passe) ramène l'abonné sur le portail.
    invitation-client-id: epayment-frontend
    invitation-redirect-uri: ${PORTAL_URL:http://localhost}/
