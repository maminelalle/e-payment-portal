spring:
  application:
    name: epayment-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/epayment}
    username: ${DB_USER:epayment}
    password: ${DB_PASSWORD:epayment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Les modèles de contrat contiennent des expressions Thymeleaf ${...} : pas de substitution Flyway.
    placeholder-replacement: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/epayment}
      # Compte de service du backend pour l'API d'administration Keycloak (création des comptes abonnés)
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: epayment-backend
            client-secret: ${KEYCLOAK_BACKEND_SECRET:epayment-backend-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/epayment/protocol/openid-connect/token
  mvc:
    problemdetails:
      enabled: true
  # Emails du portail ; en développement ils arrivent dans Mailpit (http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  jackson:
    time-zone: Africa/Nouakchott

server:
  port: 8080
  shutdown: graceful
  # IP réelle du client transmise par Nginx (X-Forwarded-For, proxys internes uniquement)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Un serveur mail indisponible ne doit pas déclarer le portail hors service (les emails sont secondaires).
    mail:
      enabled: false

epayment:
  time-zone: Africa/Nouakchott
  default-currency: MRU
  portal-url: ${PORTAL_URL:http://localhost}
  mail-from: ${MAIL_FROM:Portail E-Payment <no-reply@epayment.mr>}
  # Fournisseurs de paiement : en développement, le simulateur (simulator/, port 8090).
  # Passer aux vraies API = changer ces adresses et ces clés (docs/03-api-fournisseurs-simules.md).
  providers:
    webhook-tolerance: 300s
    bankily:
      base-url: ${BANKILY_BASE_URL:http://localhost:8090/bankily/api/v1}
      api-key: ${BANKILY_API_KEY:bankily-dev-api-key}
      webhook-secret: ${BANKILY_WEBHOOK_SECRET:bankily-dev-webhook-secret}
    masrvi:
      base-url: ${MASRVI_BASE_URL:http://localhost:8090/masrvi/v2}
      api-key: ${MASRVI_API_KEY:masrvi-dev-api-key}
      webhook-secret: ${MASRVI_WEBHOOK_SECRET:masrvi-dev-webhook-secret}
    visa:
      base-url: ${VISA_BASE_URL:http://localhost:8090/visa-gateway/api/v1}
      api-key: ${VISA_API_KEY:visa-dev-api-key}
      webhook-secret: ${VISA_WEBHOOK_SECRET:visa-dev-webhook-secret}
  receipts:
    # Clé HMAC du code de vérification imprimé dans le QR des reçus : à remplacer hors développement.
    verification-secret: ${RECEIPT_VERIFICATION_SECRET:dev-receipt-secret-a-remplacer}
  signature:
    # Clé HMAC des codes de signature : à remplacer hors développement.
    otp-secret: ${SIGNATURE_OTP_SECRET:dev-otp-secret-a-remplacer}
    otp-validity: 5m
    resend-delay: 60s
    max-sends: 5
    # Keystore PKCS#12 du certificat de scellement ; vide = certificat auto-signé de développement.
    seal-keystore: ${SIGNATURE_SEAL_KEYSTORE:}
    seal-keystore-password: ${SIGNATURE_SEAL_KEYSTORE_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:epayment-documents}
    access-key: ${S3_ACCESS_KEY:epayment-dev}
    secret-key: ${S3_SECRET_KEY:epayment-dev-secret}
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: epayment
    # Le lien d'invitation (définir son mot de passe) ramène l'abonné sur le portail.
    invitation-client-id: epayment-frontend
    invitation-redirect-uri: ${PORTAL_URL:http://localhost}/
